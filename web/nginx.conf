# ═══════════════════════════════════════════════════════════════════════════
#  nginx — เสิร์ฟ SPA + reverse proxy /api และ /hubs ไปที่ api container
#
#  ผลลัพธ์: เบราว์เซอร์เห็น origin เดียว → ไม่มี CORS เลย, refresh-token cookie
#  เป็น SameSite=Strict ได้ และไม่ต้องเจอปัญหา AllowAnyOrigin + AllowCredentials
#  ที่ SignalR บังคับให้ใช้
# ═══════════════════════════════════════════════════════════════════════════

upstream api_upstream {
    # ชื่อ service ใน docker-compose network
    server api:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Yjs snapshot upload อาจใหญ่ถึงหลาย MB (ดู MaximumReceiveMessageSize = 4MB)
    client_max_body_size 32m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/wasm image/svg+xml;

    # ─── REST API ──────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    # ─── SignalR hub ───────────────────────────────────────────────────────
    #
    # ⚠️ ถ้าไม่มี Upgrade/Connection header สองบรรทัดล่างนี้ WebSocket จะ
    #    downgrade ไปเป็น long-polling "เงียบ ๆ" — collab ยังทำงานได้แต่หน่วง
    #    และหาสาเหตุยากมาก นี่คือ Risk ที่ระบุไว้ใน PLAN.md
    #
    # proxy_read_timeout ต้องยาว เพราะ WebSocket เปิดค้างไว้ตลอด session
    # ค่า default 60s จะตัด connection ทุกนาที
    location /hubs/ {
        proxy_pass         http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering     off;   # realtime — ห้าม buffer
    }

    # ─── static assets ─────────────────────────────────────────────────────
    # Vite ใส่ content hash ในชื่อไฟล์อยู่แล้ว จึง immutable ได้
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|wasm)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # index.html ห้าม cache — ไม่งั้น deploy ใหม่แล้ว client ยังโหลด bundle เก่า
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ─── SPA fallback — ต้องอยู่ท้ายสุด ────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
