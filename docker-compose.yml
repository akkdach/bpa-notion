# ═══════════════════════════════════════════════════════════════════════════
#  ProjectManagement — dev / on-prem default
#
#  ไม่มี key `version:` — obsolete ใน Compose v2 (Docker 29.x) และจะขึ้น warning
#
#  ⚠️ api เป็น NestJS (server/) แล้ว ไม่ใช่ .NET — ดู PLAN-node.md
#     realtime ยังไม่ได้ต่อ: web/ ไม่เคยใช้ SignalR จริง (web/src/realtime/ ว่างเปล่า)
# ═══════════════════════════════════════════════════════════════════════════
name: projectmanagement

services:
  # ─────────────────────────────────────────────────────────────────────────
  #  PostgreSQL 18 + PGroonga
  #  image นี้ build บน official `postgres` image → POSTGRES_* และ
  #  /docker-entrypoint-initdb.d ใช้ได้ตามปกติ
  # ─────────────────────────────────────────────────────────────────────────
  postgres:
    image: groonga/pgroonga:4.0.6-debian-18
    container_name: pm-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-projectmanagement}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — cp .env.example .env}
      # ⚠️ ตั้งได้ครั้งเดียวตอน initdb — เปลี่ยนทีหลังต้อง dump/restore ทั้งฐาน
      #    th-TH ICU locale ทำให้ `COLLATE "th-TH-x-icu"` เรียงคำไทยถูกต้อง
      POSTGRES_INITDB_ARGS: --locale-provider=icu --icu-locale=th-TH --encoding=UTF8
    volumes:
      # ⚠️ PostgreSQL 18+ mount ที่ /var/lib/postgresql ไม่ใช่ /var/lib/postgresql/data
      #
      #    image ตั้งแต่ 18 ขึ้นไปเก็บข้อมูลใน subdirectory ตาม major version
      #    (/var/lib/postgresql/18/docker) เพื่อให้ `pg_upgrade --link` ทำงานได้
      #    โดยไม่ติดขอบ mount point ถ้า mount ที่ .../data แบบเดิม entrypoint จะ
      #    "ปฏิเสธการ start" พร้อม error ยาว ๆ ไม่ใช่แค่ warning
      #    ดู https://github.com/docker-library/postgres/pull/1259
      - pgdata:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      # ─────────────────────────────────────────────────────────────────
      #  dev เท่านั้น — ลบบรรทัดนี้ตอน production
      #  (api คุยกับ postgres ผ่าน network ภายในชื่อ `postgres:5432` อยู่แล้ว
      #   การเปิด port ออกมาข้างนอกมีไว้ให้ psql / DBeaver / dotnet ef ต่อได้)
      #
      #  ⚠️ default ไม่ใช่ 5432 เพราะเครื่อง dev มักมี PostgreSQL ของตัวเอง
      #     รันอยู่แล้ว ถ้า bind ทับ อย่างดีคือ start ไม่ขึ้น อย่างแย่คือ
      #     `dotnet ef database update` ไปลง migration ผิดฐานโดยไม่มีใครรู้
      #     และไม่ใช้ 5433 เพราะเป็นเลขที่ compose project อื่นเลือกกันบ่อย
      #
      #     เจอ "port is already allocated" → เปลี่ยน POSTGRES_HOST_PORT ใน .env
      # ─────────────────────────────────────────────────────────────────
      - "${POSTGRES_HOST_PORT:-5440}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-projectmanagement}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [app-network]

  # ─────────────────────────────────────────────────────────────────────────
  #  NestJS API
  #
  #  ⚠️ ต่อฐานด้วย pm_app ไม่ใช่ postgres — RLS ไม่มีผลกับ superuser เลย ถ้าใส่
  #     บัญชี owner ตรงนี้ policy ทุกข้อจะถูกข้ามโดยไม่มีอาการอะไรให้เห็น
  #     (DbService ตรวจข้อนี้ตอนบูตและปฏิเสธที่จะขึ้นถ้า role ผิด)
  #
  #  ⚠️ DATABASE_ADMIN_URL ไม่ได้ส่งให้ container นี้โดยเจตนา — runtime ไม่ต้อง
  #     รู้รหัสของ owner การ migrate เป็นงานของ `npm run db:setup` ที่รันแยก
  # ─────────────────────────────────────────────────────────────────────────
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: pm-api
    restart: always
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: "8080"
      DATABASE_URL: postgres://pm_app:${APP_DB_PASSWORD:?APP_DB_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-projectmanagement}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_ISSUER: ${JWT_ISSUER:-ProjectManagementAPI}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-30d}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5080:8080"
    healthcheck:
      # ⚠️ /health ตอบ 503 เมื่อ extension หาย ไม่ใช่แค่ตอนต่อฐานไม่ได้ —
      #    wget ถือว่า 503 เป็นความล้มเหลว ซึ่งเป็นสิ่งที่ต้องการ
      test: ['CMD-SHELL', 'node -e "fetch(''http://localhost:8080/api/v1/health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [app-network]

  # ─────────────────────────────────────────────────────────────────────────
  #  React SPA served by nginx, which also reverse-proxies /api
  #  → เบราว์เซอร์เห็น origin เดียว → ไม่มี CORS และ cookie เป็น SameSite=Strict ได้
  # ─────────────────────────────────────────────────────────────────────────
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
        VITE_HUB_URL: ${VITE_HUB_URL:-/hubs/doc}
    container_name: pm-web
    restart: always
    depends_on:
      - api
    ports:
      - "80:80"
    networks: [app-network]

  # ─────────────────────────────────────────────────────────────────────────
  #  Nightly logical backup — on-prem ไม่มี managed snapshot ให้พึ่ง
  #  tag ต้องตรง major version ของ server (PG 18 server ต้องใช้ pg_dump 18)
  # ─────────────────────────────────────────────────────────────────────────
  db-backup:
    image: prodrigestivill/postgres-backup-local:18
    container_name: pm-db-backup
    restart: always
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-projectmanagement}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: "14"
      BACKUP_KEEP_WEEKS: "8"
      BACKUP_KEEP_MONTHS: "6"
    volumes:
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks: [app-network]

  # ─────────────────────────────────────────────────────────────────────────
  #  Phase 9 — SignalR backplane เมื่อรัน api หลาย instance
  #  จนถึงตอนนั้น in-memory group ของ SignalR พอแล้ว
  # ─────────────────────────────────────────────────────────────────────────
  # redis:
  #   image: redis:8-alpine
  #   container_name: pm-redis
  #   restart: always
  #   command: ["redis-server", "--appendonly", "yes"]
  #   volumes: [redisdata:/data]
  #   networks: [app-network]

volumes:
  pgdata:
  # redisdata:

networks:
  app-network:
    driver: bridge
