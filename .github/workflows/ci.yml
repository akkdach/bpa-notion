name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# ยกเลิก run เก่าเมื่อ push ใหม่บน branch เดิม
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ═════════════════════════════════════════════════════════════════════════
  #  Architecture gates — job แยกและรันก่อน เพราะเร็วที่สุด (ไม่ต้อง build)
  #  และเพราะการละเมิด layer เป็นเรื่องที่ต้องรู้ก่อนอย่างอื่น
  # ═════════════════════════════════════════════════════════════════════════
  architecture:
    name: Architecture gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: node scripts/check-architecture.mjs

  # ═════════════════════════════════════════════════════════════════════════
  #  API
  # ═════════════════════════════════════════════════════════════════════════
  api:
    name: API (net10.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        working-directory: api
        run: dotnet restore

      # TreatWarningsAsErrors เปิดอยู่ใน csproj — warning ใด ๆ ทำให้ build แดง
      - name: Build
        working-directory: api
        run: dotnet build --no-restore --configuration Release

      # Phase 1 ขึ้นไป: xUnit + Testcontainers.PostgreSql
      # (Testcontainers ใช้ Docker ซึ่ง ubuntu-latest runner มีให้แล้ว)
      - name: Test
        working-directory: api
        run: |
          if [ -d ../tests ]; then
            dotnet test ../tests --configuration Release
          else
            echo "ยังไม่มี test project (Phase 0) — ข้าม"
          fi

  # ═════════════════════════════════════════════════════════════════════════
  #  Web — lint คือที่อยู่ของ layer gate ฝั่ง frontend
  # ═════════════════════════════════════════════════════════════════════════
  web:
    name: Web (React 19)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # eslint-plugin-boundaries + no-restricted-imports (axios)
      - name: Lint (รวม layer boundaries)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npx vite build

  # ═════════════════════════════════════════════════════════════════════════
  #  Docker — พิสูจน์ว่า compose stack ขึ้นได้และ health เขียว
  #  นี่คือ test ที่จับปัญหาที่ build ธรรมดาจับไม่ได้: extension หาย,
  #  nginx proxy ผิด, connection string ผิด
  # ═════════════════════════════════════════════════════════════════════════
  compose:
    name: docker compose smoke test
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v5

      - name: เตรียม .env
        run: |
          cp .env.example .env
          # ค่าจริงสำหรับ CI — ไม่ใช่ค่า placeholder
          sed -i "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=ci_$(openssl rand -hex 16)|" .env
          sed -i "s|^JWT_SECRET=.*|JWT_SECRET=$(openssl rand -base64 48 | tr -d '\n')|" .env

      - name: docker compose up
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: pgroonga ต้องติดตั้งอยู่จริง
        run: |
          docker compose exec -T postgres \
            psql -U postgres -d projectmanagement -t -A \
            -c "SELECT extname FROM pg_extension ORDER BY extname" | tee extensions.txt
          grep -qx pgroonga extensions.txt
          grep -qx pgcrypto extensions.txt
          grep -qx citext   extensions.txt

      - name: ICU locale ต้องเป็น th-TH (POSTGRES_INITDB_ARGS ทำงานจริง)
        run: |
          docker compose exec -T postgres \
            psql -U postgres -d projectmanagement -t -A \
            -c "SELECT datlocprovider::text || ' ' || datlocale FROM pg_database WHERE datname='projectmanagement'" \
            | tee locale.txt
          grep -q '^i th-TH$' locale.txt

      # ─────────────────────────────────────────────────────────────────────
      #  Thai search — regression gate
      #
      #  PGroonga ค้นภาษาไทยถูกเฉพาะเมื่อ index ระบุ tokenizer เท่านั้น
      #  ค่า default พังแบบเงียบ ๆ (ดู db/probe/thai-search-probe.sql)
      #  gate นี้จับกรณีที่มีคนสร้าง index ใหม่โดยลืม WITH (tokenizer = …)
      # ─────────────────────────────────────────────────────────────────────
      - name: Thai full-text search probe ต้อง PASS ทุกเคส
        run: |
          docker compose exec -T postgres \
            psql -U postgres -d projectmanagement -v ON_ERROR_STOP=1 \
            < db/probe/thai-search-probe.sql | tee probe.txt
          if grep -q 'FAIL' probe.txt; then
            echo "::error::Thai search probe มีเคสที่ FAIL — ตรวจว่า index ระบุ tokenizer แล้วหรือยัง"
            exit 1
          fi
          test "$(grep -c 'PASS' probe.txt)" -ge 10

      - name: API health ต้องตอบ 200
        run: |
          code=$(curl -s -o health.json -w '%{http_code}' http://localhost:5080/api/v1/health)
          cat health.json
          test "$code" = "200"

      - name: nginx ต้อง proxy /api ไปที่ api ได้
        run: |
          code=$(curl -s -o proxied.json -w '%{http_code}' http://localhost/api/v1/health)
          cat proxied.json
          test "$code" = "200"

      - name: SPA fallback ต้องทำงาน (deep link ไม่ 404)
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost/w/acme/page/abc)
          test "$code" = "200"

      - name: เก็บ log เมื่อล้มเหลว
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: ปิด stack
        if: always()
        run: docker compose down -v

  # ═════════════════════════════════════════════════════════════════════════
  #  Verify — สคริปต์ที่ยิงของจริง
  #
  #  ⚠️ ก่อนมี job นี้ ไม่มีอะไรใน CI รัน scripts/*.mjs หรือ playwright เลย
  #     smoke-test.mjs มี check() 116 ข้อที่ไม่มีใครบังคับ = เขียนไว้แล้วพังได้
  #     เงียบ ๆ การ "verify" ทุกอย่างจึงเป็นละครจนกว่าจะมี job นี้
  #
  #  ใช้ topology แบบ dev (postgres จาก compose + `dotnet run` บน 5081)
  #  ไม่ใช่ stack ใน compose ทั้งก้อน เพราะ:
  #    · verify-repair.mjs ทำข้อมูลให้เพี้ยนผ่าน scripts/run-sql.cs ซึ่งอ่าน
  #      connection string จาก configuration ชุดเดียวกับ api — ต้องชี้ฐานเดียวกัน
  #      จริง ๆ ไม่งั้นมันจะทำฐานหนึ่งเพี้ยนแล้วไปตรวจอีกฐาน ได้ผลว่า "ซ่อมสำเร็จ"
  #      ทั้งที่ไม่เคยมีอะไรเพี้ยน (คอมเมนต์ในสคริปต์นั้นเตือนเรื่องนี้ไว้แล้ว)
  #    · playwright ตั้ง baseURL ไว้ที่ vite dev server ซึ่ง proxy ไป 5081
  #
  #  env var ชั้นบนสุดของ .NET configuration จึงเป็นตัวที่ทำให้ api และ
  #  run-sql.cs ชี้ฐานเดียวกันแน่นอนโดยไม่ต้องพึ่ง User Secrets ที่ CI ไม่มี
  # ═════════════════════════════════════════════════════════════════════════
  verify:
    name: Verify (ยิง API / MCP / เบราว์เซอร์จริง)
    runs-on: ubuntu-latest
    needs: [api, web]

    env:
      PGPASSWORD_CI: ci_verify_password
      POSTGRES_HOST_PORT: '5440'
      ConnectionStrings__DefaultConnection: >-
        Host=localhost;Port=5440;Database=projectmanagement;Username=postgres;Password=ci_verify_password;Include Error Detail=true
      Jwt__Key: ci_jwt_key_ที่ยาวเกินสามสิบสองไบต์แน่นอนสำหรับการทดสอบเท่านั้น
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://localhost:5081
      API_BASE: http://localhost:5081/api/v1

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # ─────────────────────────────────────────────────────────────────────
      #  postgres เท่านั้น — ไม่ต้องการ api/web ใน container
      #
      #  volume ใหม่ทุกครั้งใน CI → db/init/001_extensions.sql ถูกรันให้เอง
      #  (นอก CI มันรันแค่ตอน volume ว่าง ซึ่งเป็นกับดักที่ README เตือนไว้)
      # ─────────────────────────────────────────────────────────────────────
      - name: เตรียม .env แล้วเปิดเฉพาะ postgres
        run: |
          cp .env.example .env
          sed -i "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=${PGPASSWORD_CI}|" .env
          sed -i "s|^JWT_SECRET=.*|JWT_SECRET=$(openssl rand -base64 48 | tr -d '\n')|" .env
          docker compose up -d postgres --wait --wait-timeout 120

      - name: ลง schema
        run: |
          dotnet tool install --global dotnet-ef --version 10.* || dotnet tool update --global dotnet-ef --version 10.*
          dotnet ef database update --project api

      # ck_pages_status กันค่าขยะจากทางที่ไม่ผ่าน service (raw SQL, psql,
      # ExecuteUpdateAsync) — ตรงนี้ตรวจแค่ว่า "มีอยู่และนิยามถูก"
      # ส่วนการพิสูจน์ว่ามันกันจริงต้องมีแถวให้กัน จึงอยู่หลัง smoke-test
      - name: ck_pages_status ต้องมีอยู่และนิยามครบสามค่า
        run: |
          docker compose exec -T postgres \
            psql -U postgres -d projectmanagement -t -A \
            -c "SELECT pg_get_constraintdef(oid) FROM pg_constraint WHERE conname = 'ck_pages_status'" \
            | tee ck.txt
          test -s ck.txt
          grep -q "'todo'"  ck.txt
          grep -q "'doing'" ck.txt
          grep -q "'done'"  ck.txt

      - name: build MCP server (verify-mcp เรียก .dll ตัวนี้)
        run: dotnet build mcp -c Release

      - name: ติดตั้ง dependency ฝั่ง web (verify-ydoc ใช้ yjs ตัวจริงจากที่นี่)
        working-directory: web
        run: npm ci

      - name: เปิด API ค้างไว้
        run: |
          dotnet run --project api --configuration Release --no-launch-profile > api.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS "${API_BASE}/health" > /dev/null 2>&1; then
              echo "API พร้อมหลังจาก ${i} วินาที"
              exit 0
            fi
            sleep 1
          done
          echo "::error::API ไม่ตอบ health ภายใน 60 วินาที"
          cat api.log
          exit 1

      # ─── สคริปต์แต่ละตัวเป็น step แยก เพื่อให้เห็นว่าตัวไหนแดง ─────────────
      - name: smoke-test (REST ตั้งแต่ register ถึงแก้เนื้อหา)
        run: node scripts/smoke-test.mjs "$API_BASE"

      # ต้องอยู่ "หลัง" smoke-test เพราะ UPDATE ที่ไม่โดนแถวไหนเลยจะสำเร็จ
      # โดยไม่แตะ constraint — บนฐานเปล่าเทสนี้จะผ่านทั้งที่ constraint หายไปก็ได้
      - name: ck_pages_status ต้องปฏิเสธค่าที่ไม่รู้จักจริง
        run: |
          rows=$(docker compose exec -T postgres \
            psql -U postgres -d projectmanagement -t -A \
            -c "SELECT count(*) FROM pages")
          echo "มี pages ${rows} แถวให้ทดสอบ"
          test "$rows" -gt 0

          # ต้อง "ล้มเหลว" — สำเร็จแปลว่า constraint ไม่ได้บังคับอะไร
          if docker compose exec -T postgres \
               psql -U postgres -d projectmanagement -v ON_ERROR_STOP=1 \
               -c "UPDATE pages SET status = 'ยังไม่เริ่ม'"; then
            echo "::error::ck_pages_status ไม่ได้กันค่าที่ไม่รู้จัก"
            exit 1
          fi

      - name: verify-ydoc (Y.Doc → bytea → bootstrap ครบรอบ)
        run: node scripts/verify-ydoc.mjs "$API_BASE"

      # ⚠️ ค้นด้วยคำ "กลาง" ประโยคเท่านั้น — คำต้นประโยคผ่านได้แม้ tokenizer ผิด
      #    เพราะ prefix match ทำงาน (ดู 003_pgroonga_indexes.sql)
      - name: verify-search (ค้นไทยกลางคำ + อ่านเนื้อหาหน้า)
        run: node scripts/verify-search.mjs "$API_BASE"

      # ⚠️ เคสสำคัญ: ลบถาวรหน้าที่มีประวัติแล้วประวัติต้องยังอยู่
      #    FK เป็น ON DELETE SET NULL (page_id) — ถ้าเป็น SET NULL เปล่า ๆ
      #    จะ null ทั้ง (workspace_id, page_id) แล้ว purge จะล้มทั้งคำสั่ง
      - name: verify-activity (ฟีดกิจกรรม + บันทึก + แยก AI จากคน)
        run: node scripts/verify-activity.mjs "$API_BASE"

      - name: verify-repair (ทำ ancestor_ids/access_root_id เพี้ยนแล้วซ่อม)
        run: node scripts/verify-repair.mjs "$API_BASE"

      - name: verify-mcp (JSON-RPC กับ MCP server จริง)
        run: node scripts/verify-mcp.mjs "$API_BASE"

      - name: playwright (เบราว์เซอร์จริง — vite dev server proxy ไป 5081)
        working-directory: web
        run: |
          npx playwright install --with-deps chromium
          npx playwright test

      - name: เก็บ log เมื่อล้มเหลว
        if: failure()
        run: |
          echo '─── api.log ───'
          tail -200 api.log || true
          echo '─── postgres ───'
          docker compose logs --no-color --tail 100 postgres || true

      # reporter เป็น list เท่านั้น (ไม่มี html report) แต่ trace ถูกเก็บไว้
      # ที่ test-results/ ตาม use.trace = 'retain-on-failure'
      - name: playwright trace เมื่อล้มเหลว
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-trace
          path: web/test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: ปิด stack
        if: always()
        run: docker compose down -v
